const MU=()=>{try{return JSON.parse(localStorage.getItem('gig_mute')||'{}')||{}}catch(e){return{}}};
const isMuted=p=>!!MU()[p];

const tzo=()=>{let z='';try{z=localStorage.getItem('gig_tz')||''}catch(e){}return z?{timeZone:z}:{}};
const dayK=t=>new Date(+t).toLocaleDateString('ru',tzo());
const hm=t=>new Date(+t).toLocaleTimeString('ru',{...tzo(),hour:'2-digit',minute:'2-digit'});
function lt(t){const d=new Date(+t),n=Date.now(),k=dayK(t);if(k===dayK(n))return hm(t);if(k===dayK(n-864e5))return'вчера';if(n-d<6*864e5)return d.toLocaleDateString('ru',{...tzo(),weekday:'short'});return d.toLocaleDateString('ru',{...tzo(),day:'2-digit',month:'2-digit',year:'2-digit'})}
function dl(t){const d=new Date(+t),n=Date.now(),k=dayK(t);if(k===dayK(n))return'Сегодня';if(k===dayK(n-864e5))return'Вчера';const y=d.toLocaleDateString('ru',{...tzo(),year:'numeric'})!==new Date().toLocaleDateString('ru',{...tzo(),year:'numeric'});return d.toLocaleDateString('ru',{...tzo(),day:'numeric',month:'long',...(y?{year:'numeric'}:{})})}

function applyDl(list,notify){DL=list;UN=list.reduce((a,d)=>a+(!isMuted(d.pid)&&d.n>0?1:0),0);if(notify&&SNAP)list.forEach(d=>{const p=SNAP[dKey(d)];if(d.n&&!d.mine&&(!p||d.ts>p)&&!isMuted(d.pid)&&!(V==='chat'&&CURPID===d.pid&&(CURAD||'')===(d.ad||'')&&!document.hidden))nfMsg(d)});SNAP={};list.forEach(d=>SNAP[dKey(d)]=d.ts);head();rowsRedraw()}
function nfMsg(d){if(!nfOn())return;const t=d.text||'Фото';if(document.hidden){if('Notification' in window&&Notification.permission==='granted'){try{const n=new Notification(d.name,{body:t,icon:'icon-192.png',badge:'favicon-48.png',tag:'gig-'+dKey(d)});n.onclick=()=>{try{window.focus()}catch(e){}n.close();if(d.pid)go('chat',d.pid+(d.ad?'_'+d.ad:''))}}catch(e){}}return}nfBanner(d,t)}
function nfBanner(d,t){if(!document.hidden)playPop();let e=$('#nfb');if(!e){e=document.createElement('div');e.id='nfb';document.body.appendChild(e)}e.innerHTML=av(d.name,d.avatar,'rd m42')+`<div class="nbm"><b>${esc(d.name)}</b><span>${esc(t)}</span></div>`;e.onclick=()=>{e.className='';if(d.pid)go('chat',d.pid+(d.ad?'_'+d.ad:''))};e.className='on';clearTimeout(NBT);NBT=setTimeout(()=>e.className='',6000)}

формить трудовые отношения, они делают это самостоятельно в порядке, установленном Трудовым кодексом РФ.\n\n## 3. Регистрация и аккаунт\n\n3.1. Пользоваться Сервисом могут дееспособные лица, достигшие 18 лет. Регистрируясь, вы подтверждаете, что вам исполнилось 18 лет.\n\n3.2. При регистрации необходимо указать достоверные данные: имя, номер телефона и адрес электронной почты. Почта подтверждается кодом, который отправляется на указанный адрес.\n\n3.3. Вы отвечаете за сохранность пароля и за все действия, совершённые из вашего аккаунта. Передавать аккаунт другим лицам нельзя. Если вы подозреваете несанкционированный доступ, сразу сообщите об этом Администрации и смените пароль.\n\n3.4. Вы можете удалить аккаунт, написав на адрес Администрации, указанный в разделе «Контакты».\n\n## 4. Правила размещения информации\n\n4.1. Вы самостоятельно отвечаете за содержание своих объявлений, откликов, фотографий, голосовых и текстовых сообщений, отзывов и любых других материалов (далее — Контент).\n\n4.2. В Сервисе запрещено размещать и распространять:\n— информацию и предложения, противоречащие законодательству РФ, а также предложения запрещённых работ, товаров и услуг;\n— сведения, призывающие к насилию, экстремизму, разжигающие ненависть или вражду, а также порнографические материалы;\n— объявления с признаками мошенничества: требование предоплаты за трудоустройство, «финансовые пирамиды», схемы с вовлечением в противоправную деятельность;\n— персональные данные других лиц без их согласия;\n— материалы, нарушающие авторские и иные права третьих лиц;\n— спам, массовые одинаковые сообщения, заведомо ложные или вводящие в заблуждение сведения;\n— объявления, направленные на привлечение несовершеннолетних к работе в нарушение закона.\n\n4.3. Администрация вправе без предварительного уведомления скрыть или удалить Контент, ограничить или заблокировать аккаунт, если обнаружит нарушение Соглашения или законодательства, получит обоснованную жалобу либо соответствующее требование упо  ПРОВАЙДЕРА ХОСТИНГА / ОБЛАЧНОГО ХРАНИЛИЩА И МЕСТО РАСПОЛОЖЕНИЯ СЕРВЕРОВ. Для граждан РФ первичная запись, систематизация, накопление, хранение, уточнение и извлечение персональных данных должны выполняться в базах данных на территории РФ — часть 5 статьи 18 закона № 152-ФЗ].\n\n4.3. Данные не продаются и не передаются третьим лицам в рекламных целях.\n\n## 5. Кому могут передаваться данные\n\n5.1. Другим пользователям Сервиса: имя, рейтинг, фотография и контактные данные, указанные в объявлении или профиле, видны другим пользователям в объёме, предусмотренном функциями Сервиса. Публикуя телефон или иные данные в объявлении, вы делаете это по собственной воле.\n\n5.2. Поставщикам технических услуг, которые помогают работе Сервиса (хостинг и хранение данных, отправка электронной почты, push-уведомления, картографические сервисы), — только в объёме, необходимом для оказания услуги, и на условиях конфиденциальности. Перечень поставщиков: [УКАЖИТЕ].\n\n5.3. Государственным органам — в случаях и порядке, предусмотренных законом.\n\n5.4. Трансграничная передача данных осуществляется только при соблюдении требований статьи 12 закона № 152-ФЗ. [УКАЖИТЕ, осуществляется ли трансграничная передача и в какие страны].\n\n## 6. Сроки хранения\n\n6.1. Данные хранятся, пока действует ваш аккаунт и согласие на обработку. После удаления аккаунта или отзыва согласия мы удаляем или обезличиваем данные в срок, не превышающий 30 дней, если иное не требуется законом (например, для защиты от претензий или по запросу госорганов).\n\n6.2. Резервные копии и технические журналы удаляются по истечении их срока хранения.\n\n## 7. Ваши права\n\n7.1. Вы вправе: получить информацию об обработке своих данных; требовать их уточнения, блокирования или уничтожения, если они неполные, устаревшие, неточные или не нужны для заявленной цели; отозвать согласие; возражать против обработки; обжаловать действия Оператора в Роскомнадзоре или в суде.\n\n7.2. Чтобы воспользоваться правами, отправьте обращение на e-mail Оператора, указав имя, телефон и почту аккаунта. Мы ответим в срок, установленный законом (до 10 рабочих дней, срок может быть продлён не более чем на 5 рабочих дней с уведомлением).\n\n7.3. Отозвать согласие можно тем же способом. Отзыв согласия может привести к невозможности пользоваться Сервисом, поскольку для его работы необходимы базовые данные аккаунта.\n\n## 8. Защита данных\n\n8.1. Оператор принимает правовые, организационные и технические меры защиты в соответствии со статьёй 19 закона № 152-ФЗ: передача данных по защищённому соединению, хранение паролей в виде хеша, ограничение и разграничение доступа, учёт обращений к данным, контроль нарушений.\n\n8.2. Если произойдёт утечка данных, Оператор уведомит Роскомнадзор в сроки, установленные законом.\n\n## 9. Cookie и локальное хранилище\n\n9.1. Сервис использует технические файлы cookie и локальное хранилище для работы входа, темы оформления, избранного и настроек. Без них Сервис работает некорректно. Вы можете удалить их в настройках браузера.\n\n## 10. Дети\n\n10.1. Сервис предназначен для лиц старше 18 лет. Мы не собираем сознательно данные несовершеннолетних. Если вы заметили такой аккаунт, сообщите нам, и мы его удалим.\n\n## 11. Изменения Политики\n\n11.1. Оператор вправе обновлять Политику. Актуальная редакция всегда доступна в Сервисе. Существенные изменения мы будем сообщать в Сервисе или по почте.", "consent": "Редакция от 27 октября 2026 года\n\nЯ, пользователь сервиса «ДелоЕсть», действуя свободно, своей волей и в своём интересе, в соответствии со статьёй 9 Федерального закона от 27.07.2006 № 152-ФЗ «О персональных данных» даю согласие оператору — [НАИМЕНОВАНИЕ ОРГАНИЗАЦИИ ИЛИ ФИО ИП], ИНН [ИНН], адрес: [ЮРИДИЧЕСКИЙ АДРЕС], e-mail: [E-MAIL ДЛЯ ОБРАЩЕНИЙ] (далее — Оператор), на обработку моих персональных данных на следующих условиях.\n\n## 1. Цели обработки\n\n— регистрация и идентификация в сервисе, вход в аккаунт, восстановление пароля;\n— размещение объявлений, отклики, переписка с други  return `<label>Адрес <span class="mu nlh">необязательно, покажем на карте</span></label><div class="adr"><input id="nwad" autocomplete="off" maxlength="160" value="${esc(N.ad)}" placeholder="Улица и дом, например: Ленина 10" oninput="NW.ad=this.value;NW.la='';NW.ln='';nwSave();mapPickHide()" onkeydown="if(event.key==='Enter'){event.preventDefault();mapFind()}"><button type="button" class="btn" onclick="mapFind()">${ico('pin')}Найти</button></div><div id="adr-res"></div><div id="adr-map"></div><div class="nh"><span id="adr-h">${N.la!==''?'Метка стоит на карте. Перетащите её или нажмите в нужное место':MHINT}</span></div>`}
function mapPickHide(){if(PMAP){try{PMAP.remove()}catch(e){}PMAP=null}const b=$('#adr-map');if(b){b.innerHTML='';b.className=''}const h=$('#adr-h');if(h)h.textContent=MHINT;const r=$('#adr-res');if(r)r.innerHTML=''}
async function mapFind(){
 const N=NW,a=N.ad.trim(),r=$('#adr-res');if(!r)return;
 if(!N.ci.trim()){r.innerHTML='<div class="nerr">Сначала укажите город выше</div>';return}
 if(!a){r.innerHTML='<div class="nerr">Введите улицу и дом</div>';return}
 r.innerHTML='<div class="mu sm2">Ищем адрес…</div>';
 const q=await geoQ(N.ci.trim()+', '+a,5);
 if(NW!==N||!$('#adr-res'))return;
 const man='<button type="button" class="adrb man" onclick="mapManual()">Не тот адрес? Указать на карте вручную</button>';
 if(q===null){$('#adr-res').innerHTML='<div class="nerr">Не удалось связаться с картой. Попробуйте ещё раз</div>';return}
 if(!q.length){$('#adr-res').innerHTML='<div class="nerr">Такой адрес не нашли. Проверьте написание</div>'+man;return}
 GRES=q;
 if(q.length===1){mapUse(0);return}
 $('#adr-res').innerHTML='<div class="adrl">'+q.map((h,i)=>`<button type="button" class="adrb" onclick="mapUse(${i})">${ico('pin')}<span>${esc(h.display_name)}</span></button>`).join('')+man+'</div>'}
function mapUse(i){const h=GRES[i];if(!h)return;NW.la=Math.round(+h.lat*1e5)/1e5;NW.ln=Math.round(+h.lon*1e5)/1e5;const r=$('#adr-res');if(r)r.innerHTML='';nwSave();mapPickShow()}
async function mapManual(){const c=await geoCity(NW.ci||'')||[55.75,37.62];NW.la=c[0];NW.ln=c[1];const r=$('#adr-res');if(r)r.innerHTML='';nwSave();mapPickShow()}
async function mapPickShow(){
 const N=NW,box=$('#adr-map');if(!box||N.la===''||N.ln==='')return;
 try{await mapLoad()}catch(e){box.innerHTML='<div class="mu sm2">Карта не загрузилась</div>';return}
 const b=$('#adr-map');if(!b||NW!==N)return;
 if(PMAP){try{PMAP.remove()}catch(e){}PMAP=null}
 b.innerHTML='';b.className='lmap sm';
 const p=[+N.la,+N.ln];PMAP=L.map(b,{scrollWheelZoom:false}).setView(p,16);mapTiles(PMAP);
 const mk=L.marker(p,{draggable:true,icon:mapIcon(N.ty)}).addTo(PMAP),set=ll=>{N.la=Math.round(ll.lat*1e5)/1e5;N.ln=Math.round(ll.lng*1e5)/1e5;nwSave()};
 mk.on('dragend',()=>set(mk.getLatLng()));PMAP.on('click',e=>{mk.setLatLng(e.latlng);set(e.latlng)});
 const h=$('#adr-h');if(h)h.textContent='Метка стоит на карте. Перетащите её или нажмите в нужное место';
 setTimeout(()=>{if(PMAP)PMAP.invalidateSize()},250)}
async function mapAutoGeo(N){if(!N.ci.trim())return;try{const q=await geoQ(N.ci.trim()+', '+N.ad.trim(),1);if(q&&q[0]){N.la=Math.round(+q[0].lat*1e5)/1e5;N.ln=Math.round(+q[0].lon*1e5)/1e5}}catch(e){}}
/* ===== Геолокация: «рядом со мной» ===== */
/* Координаты остаются только в браузере (localStorage), на сервер не отправляются.
   У объявления с меткой считаем расстояние точно, без метки — до центра города (со значком ≈). */
const hav=(a,b)=>{const r=Math.PI/180,dl=(b[0]-a[0])*r,dn=(b[1]-a[1])*r,s=Math.sin(dl/2)**2+Math.cos(a[0]*r)*Math.cos(b[0]*r)*Math.sin(dn/2)**2;return 12742*Math.asin(Math.min(1,Math.sqrt(s)))};
const kmF=k=>k<1?Math.max(50,Math.round(k*20)*50)+' м':k<10?(Math.round(k*10)/10).toString().replace('.',',')+' км':Math.round(k)+' км';
function adDist(x){if(!GEO)return null;let p=llOf(x),ap=0;if(!p){const c=x.city&&GC[geoKey(x.city)];if(c&&c.length){p=c;ap=1}}return p?{km:hav(GEO.ll,p),ap}:null}
const dKm=x=>{const d=adDist(x);return d?d.km:1e9},inRad=(x,r)=>{const d=adDist(x);return !!d&&d.km<=r};
const dstB=x=>{const d=adDist(x);return d?`<span class="cdst"> · ${d.ap?'≈ ':''}${kmF(d.km)}</span>`:''};
const dstT=x=>{const d=adDist(x);return d?` · ${d.ap?'≈ ':''}${kmF(d.km)} от вас`:''};
const meIcon=()=>L.divIcon({className:'mme',html:'<i></i>',iconSize:[22,22]});
function mapMeAdd(){if(!MAP)return;try{if(UMK)UMK.remove()}catch(e){}UMK=null;if(!GEO)return;const g=L.layerGroup();if(GEO.acc>30)L.circle(GEO.ll,{radius:Math.min(GEO.acc,2000),color:'#2f80ed',weight:1,fillOpacity:.1,interactive:false}).addTo(g);L.marker(GEO.ll,{icon:meIcon(),interactive:false,keyboard:false,zIndexOffset:-500}).addTo(g);g.addTo(MAP);UMK=g}
function geoBtn(s){document.querySelectorAll('.sbl').forEach(b=>{b.classList.toggle('on',!!GEO&&s!==1);b.classList.toggle('ld',s===1)})}
function geoNow(manual){
 if(GEOP)return GEOP;
 if(!navigator.geolocation||!window.isSecureContext){if(manual)toast('Геолокация недоступна в этом браузере',1);return Promise.resolve(GEO)}
 geoBtn(1);
 return GEOP=new Promise(ok=>navigator.geolocation.getCurrentPosition(p=>{
  const c=p.coords;GEO={ll:[Math.round(c.latitude*1e3)/1e3,Math.round(c.longitude*1e3)/1e3],acc:Math.round(c.accuracy||0),ts:Date.now()};
  try{localStorage.removeItem('gig_posd');localStorage.removeItem('gig_geooff');localStorage.setItem('gig_pos',JSON.stringify(GEO))}catch(e){}
  ok(GEO)
 },er=>{
  if(er&&er.code===1){try{localStorage.setItem('gig_posd',String(Date.now()))}catch(e){}if(manual)toast('Нет доступа к геолокации',1,'Разрешите её для сайта в настройках браузера')}
  else if(manual)toast('Не удалось определить место',1,'Проверьте GPS и интернет');
  ok(GEO)
 },{enableHighAccuracy:false,timeout:12000,maximumAge:300000})).finally(()=>{GEOP=null;geoBtn(0)})
}
/* Автоматически при открытии списка: если доступ уже разрешён — тихо обновляем, если ещё не спрашивали — браузер покажет запрос */
async function geoAuto(){
 if(!navigator.geolocation||GEOP)return;
 try{if(localStorage.getItem('gig_geooff'))return}catch(e){}
 let st='';try{st=(await navigator.permissions.query({name:'geolocation'})).state}catch(e){}
 if(st==='denied')return;
 if(GEO&&Date.now()-GEO.ts<3e5)return;
 let dn=0;try{dn=+localStorage.getItem('gig_posd')||0}catch(e){}
 if(st!=='granted'&&dn&&Date.now()-dn<2592e5)return;
 const o=GEO&&GEO.ts;await geoNow(0);
 if(GEO&&GEO.ts!==o)geoAfter()
}
function geoAfter(){geoBtn(0);if(V==='list'&&$('#cnt')){draw();geoFill();if(MAP)mapMeAdd()}}
async function geoTap(){vib(12);const o=GEO&&GEO.ts;await geoNow(1);if(!GEO)return;F.sort='';geoAfter();if(!o||GEO.ts!==o)toast('Показываем ближайшие',0,'Сначала самые близкие к вам');if(MAP)MAP.setView(GEO.ll,13)}
/* Для объявлений без метки подтягиваем центр города (кэшируется, не чаще 1 запроса в секунду) */
async function geoFill(){
 if(!GEO||GFR)return;GFR=1;let n=0,ch=0;
 try{for(const x of ADS){if(V!=='list')break;if(llOf(x)||!x.city)continue;if(geoKey(x.city) in GC)continue;if(n>=10)break;n++;await geoCity(x.city);ch=1}}catch(e){}
 GFR=0;if(ch&&V==='list'&&$('#cnt'))draw()
}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});addEventListener('hashchange',route);loadSite().then(route).then(()=>{try{geoAuto()}catch(e){}});if(U){refreshMe();pollUn()}

/* Тактильный отклик на нажатия (Android; на iPhone браузер вибрацию не даёт) */
try{if(navigator.vibrate&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const hSel='button,a,summary,[role="button"],input[type="checkbox"],.btn,.card,.cat,.fv,.gbtn,.abq,#tabs a,.ro,.chp a,.chips a,.cc,.seg button,.seg2 button,.ctabs button,.fchs button,.prow,.mrow,.ntl,.ncb,.npb,.tpb';document.addEventListener('click',e=>{const el=e.target&&e.target.closest?e.target.closest(hSel):null;if(el)vib(el.classList.contains('fv')?18:10)},true)}}catch(e){}

function hsGo(e){e.preventDefault();const i=$('#hs-q'),v=(i.value||'').trim();F.q=v;PG=12;i.value='';i.blur();go('list')}
/* Подсказка в поиске: «Найти …» печатается по буквам, стирается и сменяется следующей (как в Авито) */
const TWP=['грузчиков на переезд','сантехника','уборку квартиры','репетитора','курьера на сегодня','мастера по ремонту','сборщика мебели','помощь на даче','электрика','няню на вечер','подработку рядом'],TWS=new WeakMap();
(function(){const red=matchMedia('(prefers-reduced-motion:reduce)');
 function step(){if(document.hidden)return;const now=Date.now();document.querySelectorAll('input[data-tw]').forEach(el=>{if(!el.isConnected||el.offsetParent===null)return;
  if(!el.dataset.ph)el.dataset.ph=el.placeholder||'Найти подработку или услугу';
  if(red.matches||el.value||document.activeElement===el){if(el.placeholder!==el.dataset.ph)el.placeholder=el.dataset.ph;return}
  let st=TWS.get(el);if(!st){st={i:0,n:0,m:0,d:now};TWS.set(el,st)}
  if(now>=st.d){const ph=TWP[st.i];
   if(st.m===0){st.n++;if(st.n>=ph.length){st.n=ph.length;st.m=1;st.d=now+1700}else st.d=now+55+(st.n*37%45)}
   else if(st.m===1){st.m=2;st.d=now}
   else if(st.m===2){st.n--;if(st.n<=0){st.n=0;st.m=3;st.d=now+420}else st.d=now+28}
   else{st.i=(st.i+1)%TWP.length;st.m=0;st.d=now}}
  const busy=st.m===0||st.m===2,t='Найти '+TWP[st.i].slice(0,st.n)+((busy||Math.floor(now/500)%2===0)?'|':' ');
  if(el.placeholder!==t)el.placeholder=t})}
 setInterval(step,45)})();
</script></body></html>
